<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { background-color: #000; color: #aaa; }

      .hide-on-initial-load { display: none; }
    </style>
    <title>Capture Scene Viewer</title>
  </head>
  <body class="!h-[100vh] w-full overflow-hidden flex flex-col">
    <div class="show-on-initial-load">Loading ...</div>
    <div id="app" class="hide-on-initial-load flex flex-col h-[100dvh] w-[100vw] overflow-hidden">
      <div id="topbar" class="flex flex-row gap-4 p-2 bg-mist-900">
        <div class="text-amber-200">RenderDoc Capture Fixer</div>
      </div>
      <div class="grow shrink flex flex-row w-full items-center justify-center pb-12 overflow-hidden py-4">
        <div class="max-w-[960px] h-full overflow-auto -mr-6 pr-6">

        </div>
      </div>
    </div>
    <script type="module" src="/src/help-page.ts"></script>
  </body>


  <script>
    //#region OS tab switching
    const tabs = document.querySelectorAll(".tab");
    const contents = document.querySelectorAll("[data-content]");

    function showTab(name) {
      tabs.forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.tab === name);
      });

      contents.forEach((content) => {
        content.hidden = content.dataset.content !== name;
      });
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        showTab(tab.dataset.tab);
      });
    });

    // Default based on OS
    showTab(/Linux/i.test(navigator.userAgent) ? "linux" : "windows");
    //#endregion

    //#region expandable sections
    document.querySelectorAll(".expandable").forEach((section) => {
      const activator = section.querySelector(".expandable-activator");
      const content = section.querySelector(".expandable-content");

      activator.addEventListener("click", () => {
        const isExpanded = activator.getAttribute("aria-expanded") === "true";

        activator.setAttribute("aria-expanded", String(!isExpanded));
        content.hidden = isExpanded;
      });
    });
    //#endregion
  </script>
</html>
