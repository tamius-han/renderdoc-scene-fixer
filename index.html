<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { background-color: #000; color: #aaa; }

      .hide-on-initial-load { display: none; }
    </style>
    <title>Capture Scene Viewer</title>
  </head>
  <body>
    <div class="show-on-initial-load">Loading ...</div>

    <div id="app" class="hide-on-initial-load flex flex-col !h-[100dvh] !w-[100vw]">
      <div id="topbar" class="flex flex-row gap-4 p-2 bg-brown-700 border-b border-b-1 border-b-warm-700">
        <div class="text-amber-200">RenderDoc Capture Fixer <b>::</b></div>
        <button id="menu-import-scene">Import scene</button>
        &middot;
        <button id="menu-control-options">Control options</button>
        &middot;
        <button id="menu-fix-export">Fix & export</button>
        &middot;
        <a href="./help.html" target="_blank">Help</a>
      </div>

      <capture-importer id="capture-importer"></capture-importer>
      <loading-screen id="loading-screen"></loading-screen>
      <control-scheme id="controls-overlay"></control-scheme>
      <export-mesh id="export-overlay"></export-mesh>

      <div class="flex flex-row grow shrink overflow-hidden">
        <div id="sidebar-object-list" class="p-4 h-full overflow-hidden flex flex-col bg-brown-950 border-r border-r-1 border-r-warm-800">
          <h2 class="text-[1.25rem] font-bold text-orange-400">Objects</h2>

          <div>Select region:
            <button id="select-sphere-btn" title="Sphere select: click the mesh to place a sphere">O</button>
            <button id="select-box-btn" title="Box select: click the mesh to place a box">[]</button>
          </div>

          <div>
            Recalculate transform correction:
            <button id="recalculate-correction-btn">Recalculate</button>
            <button id="mark-ground-plane-btn" title="Click 3 points on the mesh surface to define the ground plane">Mark ground plane</button>
            <label>
              Up axis:
              <select id="up-axis-select">
                <option value="auto" selected>Auto</option>
                <option value="x">X</option>
                <option value="y">Y</option>
                <option value="z">Z</option>
                <option value="manual">Manual</option>
              </select>
            </label>
            <label>
              Coordinate system handedness:
              <select id="handedness-select">
                <option value="auto" selected>World space (right-handed)</option>
                <option value="left">Left-handed</option>
                <option value="right">Right-handed</option>
              </select>
            </label>
          </div>


          <b class="mt-8 text-white">Object list:</b>
          <div>Order by: <button>draw order</button>, <button>size</button>, <button>faces</button></div>
          <div class="grow shrink flex flex-col gap-2 overflow-auto pr-3 -mr-2" id="object-list">

          </div>
        </div>

        <div id="viewport" class="h-full w-full relative">
          <div class="absolute top-0 left-0 z-10 p-1 w-full">
            <div class="flex flex-row gap-2 bg-brown-800/75 px-4 py-2">
              <button>Select volume</button>
              &middot;
              <button>Fix distortion</button>
              &middot;
              <button>Select ground plane</button>
              &middot;
              <button>Set up axis</button>
              &middot;
              <button>Mirror</button>
              &middot;
              <button>Reset camera</button>
            </div>
          </div>


          <div class="absolute right-4 top-4">
            <div id="object-filter-menu" class="menu">
              <div class="field">
                <div class="label">Hide largest % of objects:</div>
                <div class="combined-slider-value">
                  <input type="range" id="object-filter-size-slider" min="0" max="100" value="10" />
                  <input type="text" id="object-filter-size-value" class="input-percent" min="0" max="100" value="10" />
                </div>
              </div>
              <button class="ghost" id="recenter-camera-btn" style="width: 100%; margin-top: 8px">Re-center camera</button>
            </div>
            <div id="control-options-menu">
              <div class="field">
                <div id="fly-mode-label"></div>
                <div class="sub" id="fly-speed-indicator" style="display: none"></div>
              </div>
            </div>
            <div id="select-options-menu"></div>
          </div>
          <div id="empty-hint"><div><span class="arrow">&#8630;</span>Drop an exported capture folder to begin</div></div>
          <div id="hud" style="display: none"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
